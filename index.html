<!doctype html><html><head><meta charset=utf8><meta name="color-scheme" content="only light"><meta name="supported-color-schemes" content="light only"><meta name="darkreader-lock"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:only light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Woofit Pet Spa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: cabeçalho com logo e Woofcoins, trilha de 5 cenas, palco do cachorro à esquerda e painel de tarefas à direita (empilhado no celular). Visual único e fixo da marca: roxo e laranja do logo sobre lilás claro. */
:root {
  --purple: #5b2a86;
  --purple-d: #43206a;
  --orange: #ee5a0a;
  --orange-d: #b94306;
  --lilac: #f1e9fa;
  --lilac-2: #e0d1f2;
  --card: #ffffff;
  --ink: #2a1840;
  --ink-soft: #62507a;
  --water: #55b9e8;
  --pink: #ff8fa3;
  --good: #1b7f45;
  --bad: #b3261e;
  --fur: #241f2b;
  --display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--lilac);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  margin: 0;
  padding-block: 14px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; color: var(--purple); }
h2 { font-size: 1.7rem; }
p { margin: 0; }
.wrap { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top .logo { height: 54px; width: auto; max-width: 60%; display: block; }
.coins { display: flex; align-items: center; gap: 10px; background: var(--card); border: 3px solid var(--purple); border-radius: 99px; padding: 6px 16px 6px 8px; font-weight: 800; color: var(--purple); }
.coins .coin { width: 30px; height: 30px; flex: none; }
.coins b { font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; color: var(--orange-d); }
.coins.bump b { animation: bump .4s ease; }
@keyframes bump { 40% { transform: scale(1.35); } }
.dots { display: flex; gap: 8px; align-items: center; }
.dots span { flex: 1; height: 10px; border-radius: 99px; background: var(--lilac-2); transition: background .3s; }
.dots span.on { background: var(--orange); }
.dots span.now { background: var(--purple); }
.game { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
@media (min-width: 820px) { .game { grid-template-columns: 1.05fr 1fr; } }
.stagecard { position: relative; background: var(--card); border: 3px solid var(--purple); border-radius: 26px; overflow: hidden; min-width: 0; }
#stage { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { background: var(--card); border: 3px solid var(--lilac-2); border-radius: 26px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.bubble { background: var(--lilac); border-radius: 18px; padding: 14px 16px; font-weight: 700; }
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.tasks li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--lilac); color: var(--ink-soft); font-weight: 700; }
.tasks li .tick { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--lilac-2); background: #fff; flex: none; display: grid; place-items: center; }
.tasks li.now { background: #fff; outline: 3px solid var(--orange); color: var(--ink); }
.tasks li.now .tick { border-color: var(--orange); }
.tasks li.done { color: var(--good); }
.tasks li.done .tick { background: var(--good); border-color: var(--good); }
.tasks li.done .tick::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 3px 3px 0; transform: translateY(-1px) rotate(45deg); }
.tasks li .pts { margin-left: auto; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.meter { height: 14px; border-radius: 99px; background: var(--lilac-2); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--orange); border-radius: 99px; transition: width .15s; }
.btn { font-family: var(--display); font-weight: 700; font-size: 1.25rem; border: 0; border-radius: 16px; padding: 12px 22px; min-height: 52px; cursor: pointer; background: var(--purple); color: #fff; box-shadow: 0 5px 0 var(--purple-d); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--purple-d); }
.btn.orange { background: var(--orange); box-shadow: 0 5px 0 var(--orange-d); }
.btn.orange:active { box-shadow: 0 2px 0 var(--orange-d); }
.btn:disabled { background: var(--lilac-2); color: var(--ink-soft); box-shadow: none; cursor: not-allowed; }
.btn.big { font-size: 1.5rem; padding: 16px 26px; }
.link { font: inherit; font-weight: 700; font-size: 0.9rem; background: none; border: 0; padding: 8px 4px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; align-self: center; }
button:focus-visible, input:focus-visible { outline: 4px solid var(--orange); outline-offset: 2px; }
.actions { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.choice { font: inherit; font-weight: 800; color: var(--ink); background: #fff; border: 3px solid var(--lilac-2); border-radius: 18px; padding: 12px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-height: 112px; }
.choice small { font-weight: 700; color: var(--ink-soft); font-size: 0.78rem; }
.choice.sel { border-color: var(--orange); background: #fff4ec; }
.choice.wrong { border-color: var(--bad); animation: shake .35s; }
.choice svg { width: 48px; height: 56px; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.note { font-size: 0.9rem; color: var(--ink-soft); font-weight: 700; }
.tip { color: var(--bad); font-weight: 800; min-height: 1.4em; }
.toast { position: absolute; left: 50%; top: 12px; transform: translate(-50%, -10px); background: var(--purple); color: #fff; font-family: var(--display); font-weight: 700; font-size: 1.15rem; padding: 6px 16px; border-radius: 99px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.rows { display: flex; flex-direction: column; gap: 4px; }
.rows div { display: flex; justify-content: space-between; gap: 12px; font-weight: 800; padding: 6px 12px; background: var(--lilac); border-radius: 10px; }
.rows div b { font-variant-numeric: tabular-nums; color: var(--orange-d); }
.rows div.off { opacity: .55; }
.rank { text-align: center; display: flex; flex-direction: column; gap: 2px; padding: 10px; border-radius: 18px; background: var(--purple); color: #fff; }
.rank small { font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.rank b { font-family: var(--display); font-size: 1.8rem; line-height: 1.1; }
.cta { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; border: 3px dashed var(--orange); border-radius: 20px; padding: 14px; }
.cta img { height: 44px; width: auto; max-width: 100%; }
.cta .tag { font-family: var(--display); font-weight: 700; font-size: 1.25rem; color: var(--purple); }
.lead { display: flex; flex-direction: column; gap: 8px; }
.lead label { font-weight: 800; }
.lead .row { display: flex; gap: 8px; flex-wrap: wrap; }
.lead input { flex: 1 1 200px; min-width: 0; font: inherit; border: 3px solid var(--lilac-2); border-radius: 14px; padding: 10px 14px; color: var(--ink); background: #fff; }
.lead .btn { font-size: 1.05rem; min-height: 48px; }
.staff { font-size: 0.8rem; color: var(--ink-soft); }

/* palco */
.dog { transition: none; }
.fur { fill: var(--fur); transition: fill .4s; }
#dog.wet { --fur: #151c2a; }
.eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
.tongue { transform-box: fill-box; transform-origin: 50% 0; animation: pant 1.1s ease-in-out infinite alternate; }
@keyframes pant { from { transform: scaleY(1); } to { transform: scaleY(1.07); } }
#dogmove.arrive { animation: arrive 1.5s cubic-bezier(.2,.7,.3,1) both; }
@keyframes arrive { from { transform: translateX(-340px); } to { transform: translateX(0); } }
#dogmove.hop { animation: hop .8s ease-in-out infinite alternate; }
@keyframes hop { from { transform: translateY(0); } to { transform: translateY(-14px); } }
.bg { display: none; }
#stage[data-scene="1"] .bg-front,
#stage[data-scene="2"] .bg-bath,
#stage[data-scene="3"] .bg-table,
#stage[data-scene="4"] .bg-salon,
#stage[data-scene="5"] .bg-stage { display: inline; }
#stage[data-scene="2"] .bathfront { display: inline; }
.bathfront { display: none; pointer-events: none; }
#foam circle { fill: #fff; stroke: #9fd3ea; stroke-width: 1.5; transition: opacity .3s, transform .3s; transform-box: fill-box; transform-origin: center; }
#foam circle.out { opacity: 0; transform: scale(.3) translateY(20px); }
#mud ellipse { fill: #7a5532; transition: opacity .5s; }
#mud ellipse.gone { opacity: 0; }
.drop { fill: var(--water); animation: drop .65s ease-in forwards; }
@keyframes drop { to { transform: translateY(46px); opacity: 0; } }
.puff { fill: #fff; stroke: #cdb8ea; stroke-width: 1.5; animation: puff .6s ease-out forwards; transform-box: fill-box; transform-origin: center; }
@keyframes puff { from { opacity: 1; transform: scale(.4); } to { opacity: 0; transform: scale(1.8) translateY(-14px); } }
.heart { fill: var(--pink); animation: heart 2.2s ease-out forwards; }
@keyframes heart { from { opacity: 1; transform: translateY(0) scale(.6); } to { opacity: 0; transform: translateY(-70px) scale(1.2); } }
.conf { animation: conf 3.2s linear infinite; }
@keyframes conf { from { transform: translateY(-30px) rotate(0); } to { transform: translateY(560px) rotate(360deg); } }
.target circle { fill: rgba(238,90,10,.18); stroke: var(--orange); stroke-width: 4; stroke-dasharray: 8 6; transform-box: fill-box; transform-origin: center; animation: pulse 1s ease-in-out infinite alternate; cursor: pointer; }
@keyframes pulse { to { transform: scale(1.15); } }
#shine, #drops, #tangles, #foam, #mud, #targets, #hearts, #glow { pointer-events: none; }
#shine { opacity: 0; transition: opacity .6s; }
#dog.shiny #shine { opacity: 1; }
#tool { pointer-events: none; display: none; }
#tool > g { display: none; }
#tool[data-tool="shower"] .t-shower, #tool[data-tool="sponge"] .t-sponge, #tool[data-tool="dryer"] .t-dryer, #tool[data-tool="brush"] .t-brush { display: inline; }
.prop { transform-box: fill-box; transform-origin: center; animation: propspin .35s ease-in-out infinite alternate; }
@keyframes propspin { from { transform: scaleX(1); } to { transform: scaleX(.25); } }
@media (prefers-reduced-motion: reduce) {
  .prop { animation: none; }
  .eyes, .tongue, #dogmove.arrive, #dogmove.hop, .conf, .target circle, .heart, .puff, .drop { animation: none; }
}

/* celular: o cachorro fica fixo no topo enquanto a lista de tarefas rola embaixo */
button, .choice { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.target circle.hit { fill: rgba(0,0,0,0); stroke: none; animation: none; }
@media (max-width: 819px) {
  body { padding-block: 8px 28px; }
  .wrap { gap: 10px; }
  .top .logo { height: 40px; }
  .coins { padding: 4px 12px 4px 6px; gap: 8px; }
  .coins .coin { width: 26px; height: 26px; }
  .coins b { font-size: 1.25rem; }
  .dots span { height: 8px; }
  .game { gap: 10px; }
  .stagecard { position: sticky; top: max(6px, env(safe-area-inset-top, 0px)); z-index: 5; width: min(100%, calc(50vh * 400 / 520)); width: min(100%, calc(50svh * 400 / 520)); margin: 0 auto; border-width: 2px; border-radius: 22px; box-shadow: 0 6px 16px rgba(67,32,106,.2); }
  .stagecard:has(#stage[data-scene="1"]), .stagecard:has(#stage[data-scene="5"]) { position: static; width: min(100%, 360px); }
  .toast { font-size: .9rem; padding: 6px 12px; max-width: 92%; width: max-content; white-space: normal; text-align: center; }
  .choice { font-size: .92rem; }
  .panel { padding: 14px; gap: 10px; border-width: 2px; border-radius: 22px; }
  h2 { font-size: 1.4rem; }
  .bubble { padding: 10px 12px; font-size: .95rem; }
  .tasks li { padding: 6px 10px; font-size: .9rem; }
  .choices { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .choice { min-height: 100px; padding: 10px 6px; }
  .btn.big { font-size: 1.3rem; padding: 14px 20px; }
  .rank b { font-size: 1.5rem; }
  .cta .tag { font-size: 1.1rem; }
}
@media (max-width: 950px) and (max-height: 500px) and (orientation: landscape) {
  body { padding-block: 6px 12px; }
  .game { grid-template-columns: auto minmax(0, 1fr); gap: 12px; }
  .stagecard, .stagecard:has(#stage[data-scene="1"]), .stagecard:has(#stage[data-scene="5"]) { position: sticky; top: 6px; width: calc((100vh - 76px) * 400 / 520); width: calc((100svh - 76px) * 400 / 520); max-width: 44vw; margin: 0; }
  .top .logo { height: 32px; }
}

/* o jogo tem cores próprias: nada de "modo escuro" automático do navegador mudando o cachorro */
:root { color-scheme: only light; }
@media (prefers-color-scheme: dark) { :root { color-scheme: only light; } body { background: #f1e9fa; } }
</style>

    if (bonus) addCoins(bonus, 'sem pular etapas!');
    var total = S.coins;
    var bathPts = ['wet','shampoo','foam','paws','rinse'].reduce(function (a, k) { return a + (S.done[k] ? PTS[k] : 0); }, 0);
    var dryPts = (S.done.dry ? PTS.dry : 0) + (S.done.brush ? PTS.brush : 0);
    var accPts = S.acc.length ? PTS.acc : 0;
    heartsAt(200, 180, 10);
    panel('<h2>Missão concluída!</h2>' +
      '<p class="bubble">Você arrasou! Seu amiguinho recebeu todo o carinho e cuidado que merece. Na Woofit, cada pet tem seu momento especial!</p>' +
      '<div class="rows"><div><span>Banho</span><b>' + bathPts + ' / 10</b></div><div><span>Secar e pentear</span><b>' + dryPts + ' / 10</b></div><div><span>Acessório' + (S.acc.length > 1 ? 's' : '') + (S.perfume ? ' e perfuminho' : '') + '</span><b>' + accPts + ' / 10</b></div><div class="' + (bonus ? '' : 'off') + '"><span>Bônus: nenhuma etapa para trás</span><b>' + bonus + ' / 10</b></div></div>' +
      '<div class="rank"><small>' + total + ' Woofcoins · seu título</small><b>' + titleFor(total) + '</b></div>' +
      '<div class="cta"><img src="' + LOGO + '" alt="Woofit cuidado animal"><p class="tag">Amor, cuidado e diversão em cada banho!</p><p>Conheça nossos serviços e venha cuidar do seu melhor amigo!</p></div>' +
      '<form class="lead" id="lead" novalidate><label for="mail">Quer receber novidades e ofertas da Woofit? (opcional)</label><div class="row"><input id="mail" type="email" inputmode="email" autocomplete="email" placeholder="seu@email.com"><button class="btn orange" type="submit">Quero receber</button></div><p class="tip" id="leadmsg" role="status"></p></form>' +
      '<p class="staff" id="staff" hidden></p>' +
      '<button class="btn big" id="again" type="button">Jogar de novo</button>');
    $('again').addEventListener('click', restart);
    $('lead').addEventListener('submit', function (ev) { ev.preventDefault(); submitLead(total); });
  }

  /* ---------- emails (salvos no Supabase) ---------- */
  var SUPABASE_URL = 'https://ijuryhrvqgeqztgbzvxh.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_c17yq7__uGh8Nwog4MutRA_y9M9kqmk';
  function sanitize(s) { return s.replace(/[^A-Za-z0-9_.~:@+-]/g, '_').slice(0, 190); }
  async function saveSupabase(rec) {
    if (/^COLE_AQUI/.test(SUPABASE_URL) || /^COLE_AQUI/.test(SUPABASE_KEY)) return false;
    try {
      var r = await fetch(SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/leads', {
        method: 'POST',
        headers: (function () { var h = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }; if (SUPABASE_KEY.indexOf('eyJ') === 0) h['Authorization'] = 'Bearer ' + SUPABASE_KEY; return h; })(),
        body: JSON.stringify({ email: rec.email, score: rec.score, title: rec.title })
      });
      return r.ok || r.status === 409;   /* 409 = esse email já estava na lista */
    } catch (e) { return false; }
  }
  async function submitLead(total) {
    var v = $('mail').value.trim().toLowerCase(), msg = $('leadmsg');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { msg.style.color = 'var(--bad)'; msg.textContent = 'Digite um email válido, como nome@exemplo.com.'; $('mail').focus(); return; }
    var rec = { email: v, score: total, title: titleFor(total), at: new Date().toISOString() };
    var saved = await saveSupabase(rec);
    try { if (db) { await db.doc('leads/' + sanitize(v)).set(rec); saved = true; } } catch (e) {}
    try { var arr = JSON.parse(lsGet('woofit_leads') || '[]'); arr.push(rec); lsSet('woofit_leads', JSON.stringify(arr)); } catch (e) {}
    msg.style.color = 'var(--good)'; msg.textContent = 'Obrigado! Anotamos o seu email.';
    $('lead').querySelector('button').disabled = true;
    if (staff) { $('staff').hidden = false; $('staff').textContent = saved ? 'Equipe: email salvo na lista de contatos.' : 'Equipe: não foi possível salvar na lista; o email ficou só neste aparelho.'; }
  }

  function restart() { S = freshState(); $('coins').textContent = '0'; buildDog(); go(1); }

  /* ---------- toque no palco ---------- */
  var pressed = false;
  function toSvg(e) {
    var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function currentKey() {
    if (S.scene !== 2 && S.scene !== 3) return null;
    var s = steps()[S.step]; return s ? s[0] : null;
  }
  function act(x, y) {
    var key = currentKey(); if (!key) return;
    var lx = x, ly = y - 70;
    if (key === 'wet') {
      dropAt(lx, ly - 40);
      if (inDog(lx, ly)) {
        S.wet = Math.min(100, S.wet + 2.2); setMeter(S.wet);
        if (S.wet > 35) { $('dog').classList.add('wet'); $('drops').setAttribute('opacity', 1); }
        if (S.wet >= 100) finishStep('wet');
      }
    } else if (key === 'foam') {
      var n = 0;
      CELLS.forEach(function (c) {
        if (!c.on && Math.hypot(c.x - lx, c.y - ly) < 40) {
          c.on = true;
          for (var k = 0; k < 4; k++) el('circle', { cx: c.x + Math.random() * 30 - 15, cy: c.y + Math.random() * 30 - 15, r: 13 + Math.random() * 9 }, $('foam'));
          Array.prototype.forEach.call($('mud').children, function (m, i) { if (Math.hypot(MUD[i][0] - c.x, MUD[i][1] - c.y) < 46) m.classList.add('gone'); });
        }
        if (c.on) n++;
      });
      setMeter(n / CELLS.length * 100);
      if (n / CELLS.length >= 0.9) {
        CELLS.forEach(function (c) { if (!c.on) { c.on = true; for (var k = 0; k < 3; k++) el('circle', { cx: c.x + Math.random() * 24 - 12, cy: c.y + Math.random() * 24 - 12, r: 14 + Math.random() * 8 }, $('foam')); } });
        Array.prototype.forEach.call($('mud').children, function (m) { m.classList.add('gone'); });
        finishStep('foam');
      }
    } else if (key === 'rinse') {
      dropAt(lx, ly - 40);
      var foam = $('foam').children, total = 0, left = 0;
      Array.prototype.forEach.call(foam, function (c) {
        total++;
        if (c.classList.contains('out')) return;
        if (Math.hypot(Number(c.getAttribute('cx')) - lx, Number(c.getAttribute('cy')) - ly) < 62) { c.classList.add('out'); } else left++;
      });
      setMeter(total ? (total - left) / total * 100 : 100);
      if (left === 0) { setTimeout(function () { $('foam').textContent = ''; }, 350); finishStep('rinse'); }
    } else if (key === 'dry') {
      if (inDog(lx, ly)) {
        S.dry = Math.min(100, S.dry + 2.4); setMeter(S.dry);
        $('drops').setAttribute('opacity', 1 - S.dry / 100);
        if (S.dry > 60) $('dog').classList.remove('wet');
        if (Math.random() < .5) puffAt(lx + Math.random() * 30, ly + Math.random() * 30);
        if (S.dry >= 100) { $('dog').classList.remove('wet'); $('drops').setAttribute('opacity', 0); finishStep('dry'); }
      }
    } else if (key === 'brush') {
      var left2 = 0, tot = TANGLES.length;
      tangleEls.forEach(function (t, i) {
        if (t.dataset.gone) return;
        if (Math.hypot(TANGLES[i][0] - lx, TANGLES[i][1] - ly) < 38) { t.dataset.gone = '1'; t.remove(); puffAt(TANGLES[i][0], TANGLES[i][1]); }
      });
      left2 = tangleEls.filter(function (t) { return !t.dataset.gone; }).length;
      setMeter((tot - left2) / tot * 100);
      if (left2 === 0) finishStep('brush');
    }
  }
  svg.addEventListener('pointerdown', function (e) {
    pressed = true;
    try { svg.setPointerCapture(e.pointerId); } catch (x) {}
    var p = toSvg(e); moveTool(p); act(p.x, p.y);
  });
  svg.addEventListener('pointermove', function (e) {
    var p = toSvg(e); moveTool(p);
    if (pressed || (e.pointerType === 'mouse' && e.buttons)) act(p.x, p.y);
  });
  function end() { pressed = false; }
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  svg.addEventListener('pointerleave', function () { if (!pressed) tool.style.display = 'none'; });
  function moveTool(p) {
    if (!tool.dataset.tool) return;
    tool.style.display = 'inline';
    tool.setAttribute('transform', 'translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ')');
  }

  /* ---------- início ---------- */
  async function connect() {
    try {
      if (!window.claude || !window.claude.use) return;
      var r = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      db = r[0];
      if (r[1] && r[1].isOwner) staff = !!r[1].isOwner();
    } catch (e) { db = null; }
  }
  S = freshState();
  buildDog();
  go(1);
  connect();
})();
</script>

</body></html>
